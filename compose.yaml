services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=notesdb'
      - 'POSTGRES_USER=notes_user'
      - 'POSTGRES_PASSWORD=notes_pass'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notes_user -d notesdb']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_PROFILES_ACTIVE=prod'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notesdb'
      - 'SPRING_DATASOURCE_USERNAME=notes_user'
      - 'SPRING_DATASOURCE_PASSWORD=notes_pass'
    depends_on:
      postgres:
        condition: service_healthy
