# Used when running the fully-containerized stack (see the root compose.yaml)
# or any environment where the DB is reached via connection env vars instead
# of Spring Boot's Docker Compose integration.
spring.docker.compose.enabled=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/notesdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:notes_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:notes_pass}
