# Used when running the fully-containerized stack (see the root compose.yaml)
# or any environment (e.g. Render) where the DB is reached via connection env
# vars instead of Spring Boot's Docker Compose integration.
spring.docker.compose.enabled=false

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:notesdb}
spring.datasource.username=${DB_USER:notes_user}
spring.datasource.password=${DB_PASSWORD:notes_pass}
