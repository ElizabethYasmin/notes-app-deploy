databases:
  - name: notes-db
    plan: free
    databaseName: notesdb
    user: notes_user

services:
  - type: web
    name: notes-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JDK_JAVA_OPTIONS
        value: -Xmx400m
      - key: DB_HOST
        fromDatabase:
          name: notes-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: notes-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: notes-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: notes-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: notes-db
          property: password
      # Set this after the frontend is deployed, to the real Netlify URL
      # (comma-separated if you need more than one origin), e.g.:
      # https://your-site.netlify.app
      - key: APP_CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
